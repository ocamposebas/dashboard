services:
  monitor:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-phaseone:live}
      PRESENCE_TTL_SECONDS: ${PRESENCE_TTL_SECONDS:-45}
      TRACKER_ORIGINS: ${TRACKER_ORIGINS:?Set the Phase One Labz public origins}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?Set the monitor HTTPS origin}
      COA_PUBLIC_ORIGIN: ${COA_PUBLIC_ORIGIN:-}
      MONITOR_USERNAME: ${MONITOR_USERNAME:?Set the private monitor username}
      MONITOR_PASSWORD_HASH: ${MONITOR_PASSWORD_HASH:?Set a scrypt password hash}
      SESSION_SECRET: ${SESSION_SECRET:?Set a random secret with at least 32 characters}
      ANALYTICS_HMAC_SECRET: ${ANALYTICS_HMAC_SECRET:?Set a stable random analytics secret with at least 32 characters}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      ANALYTICS_TIME_ZONE: ${ANALYTICS_TIME_ZONE:-America/Bogota}
      UPSTREAM_MONITOR_URL: ${UPSTREAM_MONITOR_URL:-}
      UPSTREAM_MONITOR_USERNAME: ${UPSTREAM_MONITOR_USERNAME:-}
      UPSTREAM_MONITOR_PASSWORD: ${UPSTREAM_MONITOR_PASSWORD:-}
      WOOCOMMERCE_URL: ${WOOCOMMERCE_URL:-}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:-}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:-}
      WOOCOMMERCE_ACCESS_MODE: ${WOOCOMMERCE_ACCESS_MODE:-read_only}
      WOOCOMMERCE_SYNC_INTERVAL_SECONDS: ${WOOCOMMERCE_SYNC_INTERVAL_SECONDS:-15}
      WOOCOMMERCE_BACKFILL_DAYS: ${WOOCOMMERCE_BACKFILL_DAYS:-400}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REDIRECT_URI: ${GOOGLE_SEARCH_CONSOLE_REDIRECT_URI:-}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${GOOGLE_SEARCH_CONSOLE_SITE_URL:-sc-domain:phaseonelabz.com}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      BARCODE_SIGNING_SECRET: ${BARCODE_SIGNING_SECRET:-}
      AFFILIATE_SERVICE_SECRET: ${AFFILIATE_SERVICE_SECRET:-}
      SHIPSTATION_API_KEY: ${SHIPSTATION_API_KEY:-}
      SHIPSTATION_RATE_MODE: ${SHIPSTATION_RATE_MODE:-live}
      SHIPSTATION_WAREHOUSE_ID: ${SHIPSTATION_WAREHOUSE_ID:-}
      SHIPSTATION_LABEL_PURCHASE_ENABLED: ${SHIPSTATION_LABEL_PURCHASE_ENABLED:-false}
      EVIDENCE_STORAGE_PATH: ${EVIDENCE_STORAGE_PATH:-}
      EVIDENCE_ENCRYPTION_SECRET: ${EVIDENCE_ENCRYPTION_SECRET:-}
      EVIDENCE_NOTIFICATION_MODE: ${EVIDENCE_NOTIFICATION_MODE:-disabled}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - fulfillment_evidence_data:/app/data/evidence
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - monitor_redis_data:/data

volumes:
  monitor_redis_data:
    name: phaseone_monitor_redis_data
  fulfillment_evidence_data:
    name: phaseone_fulfillment_evidence_data

networks:
  coolify:
    external: true
